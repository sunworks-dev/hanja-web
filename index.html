<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDF3EA">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="어흥!한자 — 한국어문회 한자능력검정시험 급수를 준비하는 학습 앱. 간격 반복(FSRS)·획순 따라쓰기·모의시험. 광고 없음, 개인정보 수집 없음.">

  <!--
    링크 미리보기·검색 노출용 메타. 주소는 lib/app_links.dart의 kWebAppUrl과
    같은 값이어야 하고(어긋나면 test/app_links_test.dart 실패), 웹 앱 배포 주소를
    옮길 때 이 파일·sitemap.xml·robots.txt·kWebAppUrl 넷을 함께 고친다.
    og:image는 새로 만들지 않고 이미 있는 앱 아이콘을 쓴다.
  -->
  <link rel="canonical" href="https://hanja-app.sunw.kr/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="어흥!한자">
  <meta property="og:title" content="어흥!한자 — 한자 급수 학습">
  <meta property="og:description" content="한국어문회 한자능력검정시험 급수를 준비합니다. 간격 반복·획순 따라쓰기·모의시험. 광고 없음, 개인정보 수집 없음.">
  <meta property="og:url" content="https://hanja-app.sunw.kr/">
  <meta property="og:image" content="https://hanja-app.sunw.kr/icons/Icon-512.png">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="어흥!한자 — 한자 급수 학습">
  <meta name="twitter:description" content="한국어문회 한자능력검정시험 급수를 준비합니다. 간격 반복·획순 따라쓰기·모의시험. 광고 없음, 개인정보 수집 없음.">
  <meta name="twitter:image" content="https://hanja-app.sunw.kr/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="어흥!한자">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>어흥!한자</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="boot.css">
  <link rel="preload" href="boot-font-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/assets/brand/title_roar.png" as="image">
</head>
<body>
  <!-- Flutter보다 먼저 그리는 브랜드 장면. 첫 프레임 즉시 제거하며 시간을 늘리지 않는다. -->
  <main id="boot" data-state="loading" aria-label="어흥!한자 시작 화면">
    <div class="boot-shell">
      <section class="boot-scene" aria-labelledby="boot-title">
        <div class="boot-title-group">
          <h1 id="boot-title">
            <img class="boot-title-roar" src="assets/assets/brand/title_roar.png" width="760" height="359" alt="어흥!" fetchpriority="high" draggable="false">
            <img class="boot-title-hanja" src="assets/assets/brand/title_hanja.png" width="440" height="263" alt="한자" draggable="false">
          </h1>
          <p class="boot-tagline">한 글자씩, 자신감이 쑥.</p>
        </div>
        <button id="boot-greet" type="button" disabled aria-label="호랑에게 인사하기" aria-describedby="boot-play-hint">
          <span class="boot-sun" aria-hidden="true"></span>
          <svg class="boot-trails" viewBox="0 0 320 300" fill="none" aria-hidden="true">
            <path d="M51 126C35 146 34 162 39 180M27 114C7 139 7 165 16 190M274 160C290 141 294 123 286 104M297 174C316 150 322 125 311 97" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <span class="boot-ripple" aria-hidden="true"></span>
          <span class="boot-character-wrap" aria-hidden="true">
            <img class="boot-tiger" src="assets/assets/characters/welcome.png" width="512" height="512" alt="" fetchpriority="high" draggable="false">
          </span>
          <img class="boot-magpie" src="assets/assets/characters/guide.png" width="512" height="512" alt="" aria-hidden="true" draggable="false">
          <span class="boot-roar" aria-hidden="true">어흥!</span>
        </button>
        <p id="boot-play-hint">호랑을 톡 눌러 보세요</p>
        <span id="boot-reaction" class="boot-sr-only" aria-live="polite"></span>
      </section>
      <div class="boot-loading">
        <div class="boot-paws" aria-hidden="true"><i></i><i></i><i></i></div>
        <p id="boot-msg" role="status" aria-live="polite">어흥!한자를 불러오고 있어요</p>
        <button id="boot-retry" type="button" hidden>다시 시도</button>
      </div>
    </div>
  </main>
  <script src="boot.js"></script>
  <script src="sw_register.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
